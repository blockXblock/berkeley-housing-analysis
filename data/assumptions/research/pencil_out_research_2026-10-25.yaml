# -------------------------------------------------------------------------------------
# 3. OPERATING EXPENSES
# -------------------------------------------------------------------------------------
operating_expenses:
  unit: "% of GSI, and $/unit/yr"
  low: 30.0
  base: 30.0
  high: 31.6
  by_type:
    pct_of_GSI_BFA24: 30.0
    pct_of_EGI_equivalent: 31.6
    market_rate_per_unit_yr: {low: 11177, base: 11877, high: 12617}
    bmr_per_unit_yr: 8760
  sources:
    - publisher: "City of Berkeley / Strategic Economics"
      title: "BFA24, Fig. 29 and Fig. 38"
      url: "https://berkeleyca.gov/sites/default/files/documents/2024-05-21%20Special%20Item%2001%20Residential%20Feasibility%20Analysis.pdf"
      date: "2024-05-21"
      quote: "Operating Expenses  % of GSI  30.0%  30.0%  0.0%"
      notes: "Per unit from Fig 38: 6-story market-rate opex $819,540 / 69 MR units = $11,877/unit/yr; 8-story $1,207,080 / 108 = $11,177. EGI equivalent: 30% of GSI / (1 - 5% vacancy) = 31.6% of EGI."
    - publisher: "City of Berkeley / Strategic Economics (in BIHO25 attachment)"
      title: "Affordability-gap method table note"
      url: "https://dev.berkeleyca.gov/sites/default/files/documents/2025-02-25%20Item%2014%20Inclusionary%20Housing%20Ordinance.pdf"
      date: "2025-02-25"
      quote: "(a) Assumes 2.5% vacancy and $730/month operations cost per unit."
      notes: "BMR opex: $730 x 12 = $8,760/unit/yr."
    - publisher: "Keyser Marston Associates for County of Santa Cruz"
      title: "Inclusionary Housing: Feasibility Study (KMA26), p. 29"
      url: "https://www.cdi.santacruzcountyca.gov/Portals/35/CDI/Planning/Housing/SC%20County%20Inclusionary%20Housing%20Feasibility%20Study.pdf"
      date: "2026-05-21"
      quote: "Operating Expenses/Unit  $12,617  $12,367"
      notes: "Santa Cruz County, not Berkeley; used only as the high per-unit bound."
  property_tax:
    note: "~1.2% of assessed value per John's brief. NOT verified: Alameda County 2025-26 TRA rate table for Berkeley not retrieved. Unclear whether BFA24's 30% includes property tax on new value (Terner's NOI definition includes property taxes). At ~$650k/unit TDC, 1.2% = ~$7,800/unit/yr, so this matters; John to decide whether to model tax separately."
  confidence: medium
  notes: "Single Berkeley source for the ratio. Check against the Rent Board-era buildings' actual operating statements if any are available."

