meta:
  drafted: "2026-10-25"
  status: "DRAFT for review. Not adopted. No DB writes, no commits."
  conventions:
    gsf: "gross building square feet"
    nrsf: "net rentable square feet"
    yoc: "yield on cost = stabilized NOI / total development cost"

# -------------------------------------------------------------------------------------
# 1. MARKET RENT  (existing series in repo; cross-check only)
# -------------------------------------------------------------------------------------
market_rent:
  existing_in_repo: "JN-Feasibility Part 2b / Part 2a + 2f: Rent Board registry lease-up rents for new buildings and collected per-bed/per-unit asking rents. Not re-researched."
  unit: "$/month and $/nrsf/month"
  low: null
  base: null
  high: null
  cross_check_by_type:
    # BFA24 Fig 26 rents / Fig 25 unit sizes (CoStar submarket rents + 10% new-construction premium)
    six_story_midrise:   {studio: {rent: 2800, sf: 500, psf: 5.60}, one_br: {rent: 3250, sf: 660, psf: 4.92}, two_br: {rent: 4500, sf: 990, psf: 4.55}}
    eight_story_midrise: {studio: {rent: 2850, sf: 510, psf: 5.59}, one_br: {rent: 3500, sf: 750, psf: 4.67}, two_br: {rent: 4300, sf: 950, psf: 4.53}}
    eighteen_story_downtown: {studio: {rent: 3300, sf: 400, psf: 8.25}, one_br: {rent: 3750, sf: 580, psf: 6.47}, two_br: {rent: 4700, sf: 800, psf: 5.88}, three_br: {rent: 6000, sf: 1100, psf: 5.45}}
    four_story_GLA_micro_studio: {rent: 2400, sf: 250, psf: 9.60}
    east_bay_TERN23_psf_range: [4.80, 5.70]
  sources:
    - publisher: "City of Berkeley / Strategic Economics"
      title: "Residential Feasibility Analysis and In-Lieu Fee Recommendations (BFA24), Fig. 25-26"
      url: "https://berkeleyca.gov/sites/default/files/documents/2024-05-21%20Special%20Item%2001%20Residential%20Feasibility%20Analysis.pdf"
      date: "2024-05-21"
      quote: "Market rate rent assumptions were established by using CoStar data from the last year ... A new construction premium of 10 percent was applied to the rents."
      notes: "psf = monthly rent / unit sf from Fig 25, e.g. 2800/500 = 5.60. Units above 8 floors in the 18-story prototype get +10% (Fig 26 'Above 8 Floors')."
    - publisher: "Terner Center for Housing Innovation"
      title: "Making It Pencil 2023, Table 4"
      url: "https://ternercenter.berkeley.edu/wp-content/uploads/2023/12/Making-It-Pencil-December-2023.pdf"
      date: "2023-12"
      quote: "Table 4: Rent Ranges for Prototype New Construction Per Square Foot (Studios to Two Bedrooms) ... East Bay (e.g., Uptown and Downtown Oakland) $5.70 - $4.80"
      notes: "Oakland, not Berkeley."
  student_by_bed: "existing_in_repo (collected per-bed rents, JN-Feasibility Part 2f). Not re-researched."
  confidence: medium
  notes: "Cross-check only. BFA24 rents are 2023-24 CoStar; the repo's Rent Board lease-up rents are the primary series."

