# 6. HARD COST BY CONSTRUCTION TYPE + CODE THRESHOLDS
# -------------------------------------------------------------------------------------
hard_cost_by_type:
  existing_in_repo: "JN-Feasibility Part 2b: Terner 2020 level (Bay Area >$380/sf 2018; affordable +$48; Type I +$65-71) escalated by TBD Consultants SF bid index. The values below are NEWER cross-checks for the type step."
  unit: "$/gsf (building area; excludes parking structure, site work, soft costs unless noted)"
  low: null
  base: null
  high: null
  by_type:
    type_V_wood_le5:            {low: 266, base: 350, high: 400}
    type_V_III_over_I_podium:   {low: 360, base: 430, high: 530}
    type_I_concrete_steel:      {low: 547, base: 550, high: 621}
    step_podium_to_type_I:
      BFA24_component_rates: "Type V $350 -> Type III $400 -> Type I $550 /gsf: Type I = +$150 (+37.5%) over Type III, +$200 (+57%) over Type V"
      BFA24_blended_building_rates: "6-story $360, 8-story $449, 18-story $547 /gsf (Fig 33)"
      SJ25_podium_vs_tower: "$424 vs $610 /gsf (+44%); secondary"
      TERNER2020_in_repo: "+$65-71/sf (regression on 2009-18 projects; much smaller step than the 2024-25 prototype studies)"
    policy_adders_berkeley:
      hard_hats_or_southside_prevailing_wage: "+18% to +25% of hard costs for projects not otherwise union (BFA24)"
      bird_safe_glass: "+1.5% of hard costs (BFA24)"
  sources:
    - publisher: "City of Berkeley / Strategic Economics"
      title: "BFA24, Fig. 33 and Fig. 34"
      url: "https://berkeleyca.gov/sites/default/files/documents/2024-05-21%20Special%20Item%2001%20Residential%20Feasibility%20Analysis.pdf"
      date: "2024-05-21"
      quote: "Residential - Type V  per gross sf ... $350  $350 ... Residential - Type III  per gross sf ... $400 ... Residential - Type I  per gross sf ... $550  $550  $550"
      notes: "Fig 33 blended 'Cost per Square Foot': 4-Story GLA $350, 6-Story $360, 8-Story $449, 18-Story $547. Type V Missing-Middle rental $400 (high for Type V). The 6-story is Type V over a Type I podium; the 8-story is Type III over Type I. Costs are 2024 dollars; not escalated here (the repo's TBD index can do it)."
    - publisher: "City of Berkeley / Strategic Economics"
      title: "BFA24, HARD HATS and Bird Safe findings"
      url: "https://berkeleyca.gov/sites/default/files/documents/2024-05-21%20Special%20Item%2001%20Residential%20Feasibility%20Analysis.pdf"
      date: "2024-05-21"
      quote: "This would increase costs by approximately 18 to 25 percent for projects that do not otherwise use union labor ... The Bird Safe Building requirement adds approximately 1.5 percent to the hard costs"
    - publisher: "Terner Center for Housing Innovation"
      title: "Making It Pencil 2023, Fig. 1 + Table 1 (East Bay 120-unit five-over-one)"
      url: "https://ternercenter.berkeley.edu/wp-content/uploads/2023/12/Making-It-Pencil-December-2023.pdf"
      date: "2023-12"
      quote: "Building Size 122,364 Square Feet ... Parking 120 Spaces ... [Fig 1 East Bay hard costs] 46.1 [2019] 52.9 [2023] (in Millions)"
      notes: "$52.9M / 122,364 gsf = $432/gsf ALL-IN hard cost incl. podium parking and 5% contingency, no prevailing wage. Used as the podium base (rounded to $430). Terner: prevailing wage 'can add $30 per square foot'."
    - publisher: "City of San Jose Housing Dept (EPS)"
      title: "Cost of Residential Development Study (SJ25)"
      url: "https://www.sanjoseca.gov/home/showpublisheddocument/126846/638996842360170000"
      date: "2025-11-21"
      quote: "[search-engine extract of the pro forma summary table, not read first-hand] podium ~ $424/sf, tower ~ $610/sf, 11-story sample ~ $621/sf; [press summary] 'Construction costs run around $266 per square foot' (wood) and 'Steel-frame construction costs about $560 per square foot'"
      notes: "PRIMARY PDF BLOCKED (403). Column mapping inferred by the search tool. $266 = Type V low bound; $621 = Type I high bound. Verify before use."
  podium_high_arithmetic: "8-story blended $449 x 1.18 (low end of the HARD HATS adder) = $530"
  code_thresholds_R2_sprinklered_NFPA13:
    type_VA:   {max_stories: 4, max_height_ft: 70}
    type_IIIA: {max_stories: 5, max_height_ft: 85}
    type_IIA:  {max_stories: 5, max_height_ft: 85}
    type_IV_HT: {max_stories: 5, max_height_ft: 85}
    type_IB:   {max_stories: 12, max_height_ft: 180}
    type_IA:   {max_stories: "unlimited", max_height_ft: "unlimited"}
    podium_510_2: "Upper building (e.g. 5 storeys IIIA, or 4 storeys VA) over a Type IA podium with 3-hour horizontal separation is treated as a separate building for stories and area. Overall HEIGHT in feet stays limited to the lesser building's limit (85 ft for IIIA over IA)."
    high_rise_403: "High-rise = occupied floor more than 75 ft above lowest fire-department vehicle access, which brings extra requirements (practical ceiling for 5-over-2 at ~85 ft)."
    california_note: "California deleted the IBC's NFPA 13R height/story allowances for Group R (DGS/SFM 2022 intervening-cycle ISOR), so use the NFPA 13 values."
    sources:
      - publisher: "WoodWorks"
        title: "Mid-Rise Design slides (2018 IBC Chapter 5)"
        url: "https://www.woodworks.org/wp-content/uploads/presentation_slides-scarlett-mid-rise-design-220727.pdf"
        date: "2022-07-27"
        quote: "Residential (R1, R2 & R4) Occupancies with NFPA 13 Sprinkler System ... IIIA IIIB IV (HT) VA VB ... Stories 5 5 5 4 3 ... Height (ft) 85 75 85 70 60"
        notes: "Same slides on 510.2: 'Overall height in feet is still limited to min of either building ... 3hr rated horizontal assembly ... Building below is Type 1A' and 'Increases allowable stories... not allowable building height'. These are model-IBC 2018 tables. The 2022 CBC (Title 24 Pt 2) was NOT read first-hand (codes.iccsafe.org returned 403)."
      - publisher: "ICC / project code analyses (via search)"
        title: "Type IB R-2 limits"
        url: "https://iccsafe.org/wp-content/uploads/ctc/IBC_v_UBC_S-2_revised.doc"
        date: "n.d."
        quote: "Type IB ... 12 stories, 180' with sprinklers"
        notes: "Confirmed only through a secondary search summary (S-2 table plus a 2015-IBC R-2 code analysis). MEDIUM-LOW confidence; confirm in CBC Tables 504.3/504.4."
  confidence: medium
  notes: "The podium-to-Type-I step is the most uncertain cost in this file: 2024-25 prototype studies put it at +37% to +57% (BFA24) or +44% (SJ25, secondary), far above Terner 2020's +$65-71. Mass-timber Types IV-A/B/C (2021 IBC / 2022 CBC) were not researched."

