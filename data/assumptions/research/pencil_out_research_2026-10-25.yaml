# -------------------------------------------------------------------------------------
# 5. TARGET YIELD ON COST / SPREAD
# -------------------------------------------------------------------------------------
yield_on_cost_spread:
  unit: "basis points over exit cap rate"
  low: 100
  base: 125
  high: 150
  by_type:
    berkeley_absolute_yoc_threshold_pct: 6.0
    implied_spread_in_BFA24_bp: 100
  sources:
    - publisher: "Terner Center for Housing Innovation"
      title: "Making It Pencil 2023, 'Measuring Return'"
      url: "https://ternercenter.berkeley.edu/wp-content/uploads/2023/12/Making-It-Pencil-December-2023.pdf"
      date: "2023-12"
      quote: "In 2019, many investors were willing to invest in projects that could demonstrate a return-on-cost (ROC) that was between 0.5 and 1.0 percent higher than capitalization rates. Today, investors require project ROC to be 1.0 to 1.5 percent higher than capitalization rates"
    - publisher: "City of Berkeley / Strategic Economics"
      title: "BFA24, pro forma method"
      url: "https://berkeleyca.gov/sites/default/files/documents/2024-05-21%20Special%20Item%2001%20Residential%20Feasibility%20Analysis.pdf"
      date: "2024-05-21"
      quote: "rental projects were deemed feasible at a yield on cost of at least six percent"
      notes: "With BFA24's own 5.0% cap rate, 6.0% - 5.0% = 100 bp."
    - publisher: "Keyser Marston Associates"
      title: "KMA26, p. 29"
      url: "https://www.cdi.santacruzcountyca.gov/Portals/35/CDI/Planning/Housing/SC%20County%20Inclusionary%20Housing%20Feasibility%20Study.pdf"
      date: "2026-05-21"
      quote: "significantly lower than the 6% benchmark being applied in this analysis"
      notes: "KMA also benchmarks rental feasibility at a 6% stabilized return on total investment."
  confidence: high
  notes: "base = midpoint of Terner's 100-150 bp. Note the JN rule (YoC vs cap + spread) and BFA24's absolute 6% agree only if the cap is ~4.75-5.0%. With CBRE Oakland 5.5-6.5% plus 100-150 bp, the hurdle is 6.5-8.0%."

