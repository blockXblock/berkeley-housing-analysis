# Berkeley zoning district standards -> the envelope a housing project may build, per district code.
# RECORD: every district row cites the BMC section and the copy it was read from. The City's code host
# (berkeley.municipal.codes) refuses scripted requests, so the sections were read from Wayback Machine copies
# (capture date and the "current through Ordinance ..." line recorded per row) and from the City's own ordinance PDFs.
# Downloads: scratch/2026-10-25/zoning/bmc/ (html + ordinance text). Districts are the ZONECLASS values of the City's
# zoning layer (gis.cityofberkeley.info/arcgis/rest/services/Public/Portal_Planning/MapServer/7), saved as
# data/reference/berkeley_zoning_districts_2026-10-25.geojson.
#
# How the pencil-out uses a row (scripts/v4/pencil_out.py, allowed_envelope):
#   stories      = min(max_stories, the stories that fit under max_height_ft at the assumptions file's floor-to-floor)
#   far_max      = cap on gross floor area / lot area (null = no cap)
#   density_max  = cap on dwelling units per acre (null = no cap)
#   residential  = false -> the parcel is out of the zoned universe (multi-unit housing not permitted)
# Where a district offers two envelopes (mixed use vs residential only), the row records the one with MORE floor area
# and says so in `note`; the model does not pick between them.
#   ground       = 'residential' -> the ground floor is homes (residential districts and residential-only envelopes);
#                  absent -> the model's default ground floor (retail + lobby) and its default coverages
#   lot_coverage = the district's maximum lot coverage for the envelope's stories (null = the model's default)
# Use-permit (discretionary) height increases are recorded but NOT used: the zoned pass is the standard envelope.

version: 2026-10-25
as_of_code: "Commercial chapter current through Ord. 8001-N.S. (2026-02-10); residential R-1/R-2/R-2A per Ord. 8007-N.S. (passed to print 2026-04-28)"

state_density_bonus:
  # RECORD (law): Gov. Code 65915(f)(2) as amended by AB 2345 (2020): 10% of base units at very low income -> 32.5%.
  # The pencil-out's on-site scenario is 20% affordable, half VLI and half LI = 10% VLI of total units.
  bonus_share: 0.325
  source: "Cal. Gov. Code 65915(f)(2) (AB 2345, 2020): VLI 10% -> 32.5% density bonus"
  # ASSUMPTION: waivers (65915(e)) grant the height needed to fit the bonus units, so the bonus adds stories:
  # allowed stories = round(base stories x (1 + bonus_share)); FAR and density caps are multiplied by (1 + bonus_share).
  stories_rule: round
  label: "ASSUMPTION (waiver height = the bonus floor area stacked as stories)"

# A district's local bonus, where the code has one, replaces the state bonus in the on-site scenario if it is larger.
