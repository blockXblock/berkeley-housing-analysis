<text x="60" y="871.5999999999999" font-size="16"><tspan font-weight="bold" fill="#b88a00">Gas.</tspan> PG&amp;E's 10–12 in. distribution main (198 psi; laid 1966 and 1983)</text>
<text x="60" y="893.5999999999999" font-size="16">crosses Shattuck about 12 m north of Allston, not at this section: see the plan.</text>
<text x="60" y="931.5999999999999" font-size="16"><tspan font-weight="bold">Electric, phone, cable:</tspan> underground here (Underground Utility</text>
<text x="60" y="953.5999999999999" font-size="16">District), routes not public; nor are low-pressure gas or private fiber.</text>
<text x="60" y="991.5999999999999" font-size="16"><tspan font-weight="bold">Solid</tspan> = position and depth from City or EBMUD records.</text>
<text x="60" y="1013.5999999999999" font-size="16"><tspan font-weight="bold">Dashed</tspan> = position from records, depth assumed or schematic.</text>
<text x="60" y="1051.6" font-size="16"><tspan font-weight="bold">Will it back up?</tspan> City branch drains are sized for a 10-year storm (2.03 in.</text>
<text x="60" y="1073.6" font-size="16">in 6 hours); bigger storms are expected to pond and run down the street [1]. The</text>
<text x="60" y="1095.6" font-size="16">City has not yet published a capacity model for downtown (Strawberry watershed):</text>
<text x="60" y="1117.6" font-size="16">its 2011 plan modeled 2 of 10 watersheds, and the citywide model was still being</text>
<text x="60" y="1139.6" font-size="16">calibrated in Aug 2025 [1, 2]. On 22 Dec 2025, 5 of the City's 36 storm-drain</text>
<text x="60" y="1161.6" font-size="16">service requests came from this block's corners [3].</text>
<text x="60" y="1199.6" font-size="16"><tspan font-weight="bold">The 36 in. sewer</tspan> is sized for rain that leaks into old sewers, not for sewage:</text>
<text x="60" y="1221.6" font-size="16">a 2014 federal consent decree requires Berkeley, EBMUD and neighbors to cut those</text>
<text x="60" y="1243.6" font-size="16">wet-weather flows by 2036 [4]. Its recorded inverts sit too close to the rims, so</text>
<text x="60" y="1265.6" font-size="16">its depth here is an estimate.</text>
<text x="60" y="1416" font-size="13" font-style="italic">Data: EBMUD water mains; City of Berkeley sewers, storm drains and manholes (pulled 30 Aug 2026); Alameda County assessor parcels (Feb 2026).</text>
<text x="60" y="1437" font-size="13" font-style="italic">[1] City of Berkeley, Watershed Management Plan (Oct 2011, adopted 2012), ch. 6. [2] City of Berkeley, Stormwater Master Plan community meeting, 28 Aug 2025.</text>
<text x="60" y="1458" font-size="13" font-style="italic">[3] City of Berkeley open data, 311 Cases (p88g-6gs2), "Storm Drain Problem/Maintenance". [4] Berkeleyside, "Winter storms test East Bay's progress...", 3 May 2023.</text>
<text x="60" y="1479" font-size="13" font-style="italic">After CE 112, UC Berkeley, lab of 21 Oct 2022 (Carlton Chan, EBMUD): "design a new water distribution pipeline along Shattuck Ave from Center St to Allston St."</text>
</svg>