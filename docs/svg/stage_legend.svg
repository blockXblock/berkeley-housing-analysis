<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="t d"><title id="t">What the colors on the flyovers mean</title><desc id="d">195 buildings on the flyovers</desc><style>
