<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 444" width="380" height="444" role="img" aria-labelledby="t d"><title id="t">What the colours on the flyovers mean</title><desc id="d">194 buildings on the flyovers</desc><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .ttl  { font-size: 13px; font-weight: 700; fill: #1a365d; letter-spacing: .06em; }
    .meta { font-size: 11px; fill: #718096; }
    .name { font-size: 12px; font-weight: 700; fill: #2d3748; }
    .desc { font-size: 10.5px; fill: #5a6779; }
    .cnt  { font-size: 17px; font-weight: 700; }
    .band { font-size: 9px; font-weight: 700; fill: #a9b3c0; letter-spacing: .1em; }
    .rail { stroke: #d6dde6; stroke-width: 2; fill: none; }
    .dot  { animation: rideY 9s ease-in-out infinite; }
    @keyframes rideX { from{} }
    @keyframes rideY { 0.00% { transform: translateY(58.0px); } 11.00% { transform: translateY(58.0px); } 20.00% { transform: translateY(104.0px); } 31.00% { transform: translateY(104.0px); } 40.00% { transform: translateY(150.0px); } 51.00% { transform: translateY(150.0px); } 60.00% { transform: translateY(196.0px); } 71.00% { transform: translateY(196.0px); } 80.00% { transform: translateY(242.0px); } 91.00% { transform: translateY(242.0px); } 100.00% { transform: translateY(288.0px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style><rect width="380" height="444" fill="#ffffff"/><text class="ttl" x="24" y="26">WHERE EACH PROJECT STANDS</text><text class="meta" x="24" y="43">194 buildings on the flyovers</text><path class="rail" d="M38 58 V288"/><g class="dot"><circle cx="38" cy="0" r="4.5" fill="#1a365d" opacity=".85"/></g><g><circle cx="38.0" cy="58.0" r="11" fill="#7a7a7a" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="63">Pre-Application</text><text class="cnt" x="356" y="63" text-anchor="end">7</text><text class="desc" x="64" y="77">at pre-application</text></g><g><circle cx="38.0" cy="104.0" r="11" fill="#b8860b" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="109">In Review</text><text class="cnt" x="356" y="109" text-anchor="end">69</text><text class="desc" x="64" y="123">under review</text></g><g><circle cx="38.0" cy="150.0" r="11" fill="#ff8000" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="155">Entitled</text><text class="cnt" x="356" y="155" text-anchor="end">50</text><text class="desc" x="64" y="169">approved, no building permit yet</text></g><g><circle cx="38.0" cy="196.0" r="11" fill="#00b8cc" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="201">Permitted</text><text class="cnt" x="356" y="201" text-anchor="end">12</text><text class="desc" x="64" y="215">permitted, not yet started</text></g><g><circle cx="38.0" cy="242.0" r="11" fill="#2962ff" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="247">Under Construction</text><text class="cnt" x="356" y="247" text-anchor="end">9</text><text class="desc" x="64" y="261">under construction</text></g><g><circle cx="38.0" cy="288.0" r="11" fill="#00a844" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="293">Completed</text><text class="cnt" x="356" y="293" text-anchor="end">42</text><text class="desc" x="64" y="307">completed and occupiable</text></g><text class="band" x="64" y="336" fill="#b9c2cd">LEFT THE PIPELINE</text><g><circle cx="38.0" cy="354.0" r="11" fill="#b0003a" stroke="#ffffff" stroke-width="3"/><text class="name" x="64" y="359">Withdrawn</text><text class="cnt" x="356" y="359" text-anchor="end">5</text><text class="desc" x="64" y="373">withdrawn</text></g><text class="meta" x="24" y="422">Thick outline = permitted by its own agency:</text><circle cx="31" cy="433" r="6" fill="#ffffff" stroke="#aa00ff" stroke-width="3.5"/><text class="meta" x="43" y="437">UC Berkeley</text><circle cx="125.9" cy="433" r="6" fill="#ffffff" stroke="#ff00ff" stroke-width="3.5"/><text class="meta" x="137.9" y="437">BART joint development</text></svg>