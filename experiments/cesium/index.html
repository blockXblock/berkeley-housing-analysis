<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Berkeley Housing — Cesium Demo</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      max-width: 320px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="info">
    <strong>Berkeley Housing Pipeline — Cesium Demo</strong><br>
    Loading geometry.kml from berkeleybuild.com...<br>
    <span id="status">Initializing viewer.</span>
  </div>
  <script>
    // Cesium ion token: replace this with your own free token from
    // https://ion.cesium.com/signup
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJmNjUwMTk0Mi1mZTk4LTQ1YzItYjNjNi1mZTBmMjAzYzdiZTkiLCJpZCI6NDMzMjY0LCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3NzkxNDY0NjF9.EvsGPQArwKqz0Lh1brQHBbT1ClPd41pEAJbfkgVhU_g';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      timeline: false,
      baseLayerPicker: true,
      geocoder: false,
    });

    // Fly camera to Berkeley
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-122.27, 37.87, 4000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-30),
        roll: 0.0,
      },
      duration: 2.0,
    });

    // Load the KML
    const statusEl = document.getElementById('status');
    // const KML_URL = 'https://berkeleybuild.com/geometry.kml';
    const KML_URL = 'https://berkeleybuild.com/kml_versions/Geometry/Geometry-2026-05-17.kml';
    statusEl.textContent = 'Fetching geometry.kml...';

    Cesium.KmlDataSource.load(KML_URL, {
      camera: viewer.scene.camera,
      canvas: viewer.scene.canvas,
      clampToGround: false,
    })
    .then(function (dataSource) {
      viewer.dataSources.add(dataSource);
      viewer.zoomTo(dataSource);
      statusEl.textContent =
        'Loaded ' + dataSource.entities.values.length + ' entities. ' +
        'Click any building for details.';
    })
    .catch(function (error) {
      statusEl.textContent = 'Error loading KML: ' + error.message;
      console.error(error);
    });
  </script>
</body>
</html>
