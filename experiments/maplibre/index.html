<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Berkeley Housing — MapLibre Demo</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      max-width: 320px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info">
    <strong>Berkeley Housing Pipeline — MapLibre Demo</strong><br>
    <span id="status">Loading map...</span>
  </div>
  <script>
    const statusEl = document.getElementById('status');

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/positron',
      center: [-122.27, 37.87],
      zoom: 14,
      pitch: 50,
      bearing: 0,
    });

    map.on('load', async function () {
      statusEl.textContent = 'Fetching geometry.kml...';

      try {
        const response = await fetch('https://berkeleybuild.com/geometry.kml');
        const kmlText = await response.text();
        const kmlDoc = new DOMParser().parseFromString(kmlText, 'application/xml');
        const geojson = toGeoJSON.kml(kmlDoc);

        // togeojson converts KML <MultiGeometry> to GeoJSON GeometryCollection.
        // Our labeled Placemarks all use MultiGeometry<Point + Polygon> for label anchoring.
        // Extract just the Polygon from each GeometryCollection so MapLibre can extrude it.
        let unwrapped = 0;
        geojson.features.forEach(f => {
          if (f.geometry && f.geometry.type === 'GeometryCollection') {
            const polygon = f.geometry.geometries.find(g => g.type === 'Polygon');
            if (polygon) {
              f.geometry = polygon;
              unwrapped++;
            }
          }
        });
        console.log(`Unwrapped ${unwrapped} GeometryCollections to Polygons`);
        
let extracted = 0, defaulted = 0;
        geojson.features.forEach(f => {
          if (f.geometry && f.geometry.type === 'Polygon') {
            // Try to extract altitude from the first vertex's z-coordinate
            const coords = f.geometry.coordinates[0];
            let height = null;
            if (coords.length && coords[0].length >= 3) {
              height = coords[0][2];
            }
            // Fall back: parse height from KML description text ("Height: 35.0m")
            if (height === null && f.properties.description) {
              const match = f.properties.description.match(/Height:\s*([\d.]+)\s*m/i);
              if (match) {
                height = parseFloat(match[1]);
              }
            }
            // Final fallback: 12m (a reasonable default for unknown building height)
            if (height === null || isNaN(height)) {
              height = 12;
              defaulted++;
            } else {
              extracted++;
            }
            f.properties.height = height;
          }
        });
        console.log(`Heights: ${extracted} extracted from coords/description, ${defaulted} defaulted to 12m`);

        map.addSource('housing', {
          type: 'geojson',
          data: geojson,
        });

        map.addLayer({
          id: 'housing-3d',
          type: 'fill-extrusion',
          source: 'housing',
          filter: ['==', '$type', 'Polygon'],
          paint: {
            'fill-extrusion-color': '#ff9800',
            'fill-extrusion-height': ['get', 'height'],
            'fill-extrusion-base': 0,
            'fill-extrusion-opacity': 0.85,
          },
        });

        const polygonCount = geojson.features.filter(
          f => f.geometry && f.geometry.type === 'Polygon'
        ).length;
        statusEl.textContent = 'Loaded ' + polygonCount + ' buildings.';
      } catch (error) {
        statusEl.textContent = 'Error: ' + error.message;
        console.error(error);
      }
    });

    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
