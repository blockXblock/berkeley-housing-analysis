<style>
  #pipeline-anim { color: #1a365d; text-align: left; }
  #pipeline-anim svg text { font-size: 10px; fill: #718096; }
  .pn-btn { width: 100%; display: flex; align-items: center; gap: 14px; border: 0; cursor: pointer; text-align: left; font-family: inherit;
            background: linear-gradient(135deg, #1a365d, #2c5282); color: #fff; border-radius: 14px; padding: 14px 18px;
            box-shadow: 0 4px 14px rgba(26,54,93,.25); transition: transform .15s, box-shadow .15s; }
  .pn-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,54,93,.3); }
  .pn-btn .ico { flex: 0 0 46px; height: 46px; border-radius: 50%; background: #ffd166; color: #1a365d; display: grid; place-items: center; font-size: 20px; }
  .pn-btn[data-state=playing] .ico::before { content: '\275A\275A'; font-size: 15px; } .pn-btn[data-state=stopped] .ico::before { content: '\25B6'; }
  .pn-btn .t { font-size: clamp(1.05rem, 3.4vw, 1.45rem); font-weight: 800; line-height: 1.2; display: block; }
  .pn-btn .lbl { display: block; font-size: .8rem; font-weight: 500; color: #cfe3ee; margin-top: 2px; }
  .pn-row { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin: 12px 2px 2px; color: #4a5568; font-size: .9rem; }
  .pn-row .date { font-size: 1.5rem; font-weight: 800; color: #1a365d; font-variant-numeric: tabular-nums; min-width: 6.5rem; }
  .pn-row b { font-size: 1.2rem; color: #1a365d; font-variant-numeric: tabular-nums; }
  .pn-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: #4a5568; margin: 8px 2px; }
  .pn-sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #pipeline-anim .pn-cap { color: #718096; font-size: .78rem; margin: 4px 2px 0; max-width: none; }
  #pipeline-anim details.pn-more { margin-top: 14px; background: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  #pipeline-anim details.pn-more summary { cursor: pointer; font-weight: 700; color: #1a365d; }
  #pn-waffle { display: block; width: 100%; margin-top: 8px; }
</style>
<section id="pipeline-anim" aria-label="Berkeley's housing pipeline, month by month">
<button class="pn-btn" id="pn-go" data-state="stopped"><span class="ico"></span>
  <span><span class="t">Play Berkeley's housing pipeline, month by month</span><span class="lbl"></span></span></button>
<div class="pn-row"><span class="date" id="pn-date"></span><span>In the pipeline <b id="pn-pipe"></b></span>
  <span>Finished in the last 12 months <b id="pn-recent"></b></span></div>
<svg id="pn-stack" width="100%" height="210" role="img" aria-label="Homes at each stage of the pipeline, 2018 to today"></svg>
<div class="pn-key"><span><span class="pn-sw" style="background:#7a7a7a"></span>Pre-application</span><span><span class="pn-sw" style="background:#b8860b"></span>Under review</span><span><span class="pn-sw" style="background:#ff8000"></span>Entitled</span><span><span class="pn-sw" style="background:#ff0000"></span>Entitled 3+ yrs, inactive</span><span><span class="pn-sw" style="background:#00b8cc"></span>Permitted, not started</span><span><span class="pn-sw" style="background:#2962ff"></span>Under construction</span><span><span class="pn-sw" style="background:#00a844"></span>Completed in the last 12 months</span></div>
<svg id="pn-months" width="100%" height="84" role="img" aria-label="Homes completed each month, the last 12 months"></svg>
<p class="pn-cap" id="pn-note"></p>
<details class="pn-more"><summary>See every project as squares, 10 homes each</summary><canvas id="pn-waffle"></canvas></details>
</section>
<script>(() => {
const D = __DATA__;
// Mockup engine: the same rules as scripts/viz/pipeline_animation_template.html, parametrized by element.
const STAGES = [
  {k: 'preapp', label: 'Pre-application', color: '#7a7a7a'}, {k: 'review', label: 'Under review', color: '#b8860b'},
  {k: 'entitled', label: 'Entitled, no permit yet', color: '#ff8000'}, {k: 'stalled', label: 'Entitled 3+ years, inactive', color: '#ff0000'},
  {k: 'permitted', label: 'Permitted, not started', color: '#00b8cc'}, {k: 'building', label: 'Under construction', color: '#2962ff'},
  {k: 'completed', label: 'Completed, all records', color: '#00a844'}, {k: 'left', label: 'Withdrawn, denied, expired', color: '#b0003a'}];
const PIPE = ['preapp', 'review', 'entitled', 'stalled', 'permitted', 'building'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NS = 'http://www.w3.org/2000/svg';
const label = i => { const m = D.start[1] - 1 + i; return `${MONTHS[m % 12]} ${D.start[0] + Math.floor(m / 12)}`; };
function stageAt(r, i) {
  const [first, ent, bp, co, out, u, pre, ins, act, entd] = r;
  if (first === null || first > i) return null;
  if (out !== null && out <= i) return 'left';
  if (co !== null && co <= i) return 'completed';
  if (bp !== null && bp <= i) return ins !== null && ins <= i ? 'building' : 'permitted';
  if (ent !== null && ent <= i) {
    const T = D.frame_days[i]; let recent = null; for (const a of act) { if (a <= T) recent = a; else break; }
    return T - entd > 1095 && (recent === null || T - recent > 1095) ? 'stalled' : 'entitled';
  }
  return pre ? 'preapp' : 'review';
}
const FRAMES = [];
for (let i = 0; i <= D.last; i++) {
  const u = Object.fromEntries(STAGES.map(s => [s.k, 0]));
  u.recent = i >= 12 && i <= D.co_end ? 0 : null;
  for (const r of D.rows) { const s = stageAt(r, i); if (s) u[s] += r[5]; if (u.recent !== null && r[3] !== null && r[3] <= i && r[3] > i - 12) u.recent += r[5]; }
  u.pipe = PIPE.reduce((a, k) => a + u[k], 0);
  FRAMES.push(u);
}
const MONTHLY = new Array(D.last + 1).fill(0);
for (const r of D.rows) if (r[3] !== null && r[3] >= 0 && r[3] <= D.last) MONTHLY[r[3]] += r[5];
const MAXM = Math.max(...MONTHLY.slice(12));
const recentText = i => FRAMES[i].recent !== null ? FRAMES[i].recent.toLocaleString()
  : i > D.co_end ? FRAMES[D.co_end].recent.toLocaleString() : '—';

// stacked layers; with reveal, only the months up to i are shown (the chart "grows" as it plays)
function makeStack(svg, H, reveal) {
  const order = ['preapp', 'review', 'entitled', 'stalled', 'permitted', 'building', 'recent'];
  const colorOf = k => k === 'recent' ? '#00a844' : STAGES.find(s => s.k === k).color;
  let cur, clip, W;
  function build() {
    svg.innerHTML = ''; W = svg.clientWidth; const pad = 16;
    const top = Math.max(...FRAMES.map(f => order.reduce((a, k) => a + (f[k] || 0), 0)));
    const x = i => i / D.last * W, y = v => H - pad - v / top * (H - pad - 6);
    const id = 'c' + Math.random().toString(36).slice(2);
    svg.insertAdjacentHTML('beforeend', `<defs><clipPath id="${id}"><rect x="0" y="0" height="${H}" width="${W}"/></clipPath></defs>`);
    clip = svg.querySelector('rect');
    const g = document.createElementNS(NS, 'g'); if (reveal) g.setAttribute('clip-path', `url(#${id})`); svg.appendChild(g);
    let base = FRAMES.map(() => 0);
    for (const k of order) {
      const hi = FRAMES.map((f, i) => base[i] + (f[k] || 0));
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M' + hi.map((v, i) => `${x(i)},${y(v)}`).join('L') + 'L' + base.map((v, i) => `${x(i)},${y(v)}`).reverse().join('L') + 'Z');
      p.setAttribute('fill', colorOf(k)); p.setAttribute('opacity', .9); g.appendChild(p); base = hi;
    }
    for (let yr = D.start[0]; yr <= D.start[0] + Math.floor(D.last / 12); yr++) {
      const t = document.createElementNS(NS, 'text'); t.setAttribute('x', x((yr - D.start[0]) * 12) + 2); t.setAttribute('y', H - 3);
      t.textContent = yr; svg.appendChild(t);
    }
    const cx = x(D.cycle6), cl = document.createElementNS(NS, 'line');
    for (const [a, v] of [['x1', cx], ['x2', cx], ['y1', 0], ['y2', H - pad], ['stroke', '#a0aec0'], ['stroke-dasharray', '3 3']]) cl.setAttribute(a, v);
    svg.appendChild(cl);
    const ct = document.createElementNS(NS, 'text'); ct.setAttribute('x', cx + 4); ct.setAttribute('y', 11); ct.textContent = '6th RHNA cycle →'; svg.appendChild(ct);
    cur = document.createElementNS(NS, 'line'); cur.setAttribute('y1', 0); cur.setAttribute('y2', H - pad);
    cur.setAttribute('stroke', '#1a365d'); cur.setAttribute('stroke-width', 2); svg.appendChild(cur);
  }
  build(); window.addEventListener('resize', build);
  return i => { const X = i / D.last * W; cur.setAttribute('x1', X); cur.setAttribute('x2', X); if (reveal) clip.setAttribute('width', Math.max(X, 1)); };
}
function makeMonths(svg, H) {
  return i => {
    svg.innerHTML = ''; const W = svg.clientWidth, pad = 14, top = 12, n = 12, bw = W / n;
    const y = v => H - pad - Math.min(v, MAXM) / MAXM * (H - pad - top);
    for (let j = 0; j < n; j++) {
      const m = i - n + 1 + j; if (m < 0) continue;
      const v = MONTHLY[m], partial = m > D.co_end;
      svg.insertAdjacentHTML('beforeend',
        `<rect x="${j * bw + 2}" width="${bw - 4}" y="${y(v)}" height="${H - pad - y(v)}" fill="${partial ? '#9fdcb6' : '#00a844'}"/>` +
        `<text x="${j * bw + bw / 2}" y="${Math.min(y(v), H - pad) - 2}" text-anchor="middle">${v}</text>` +
        `<text x="${j * bw + bw / 2}" y="${H - 2}" text-anchor="middle">${bw < 40 ? label(m)[0] : label(m).slice(0, 3)}</text>`);
      if (m === D.co_end + 1) svg.insertAdjacentHTML('beforeend',
        `<line x1="${j * bw}" x2="${j * bw}" y1="0" y2="${H - pad}" stroke="#4a5568" stroke-dasharray="3 3"/><text x="${j * bw + 3}" y="9">partial →</text>`);
    }
  };
}
function makeWaffle(cv) {
  const ctx = cv.getContext('2d'), COLS = 60;
  const ROWS = Math.ceil((Math.max(...FRAMES.map(f => STAGES.reduce((a, s) => a + Math.round(f[s.k] / 10), 0))) + COLS) / COLS);
  return i => {
    const f = FRAMES[i], W = cv.clientWidth; if (!W) return; const cell = W / COLS, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = ROWS * cell * dpr; cv.style.height = ROWS * cell + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let n = 0;
    for (const s of STAGES) {
      if (s.k === 'left') n = Math.ceil(n / COLS) * COLS + COLS;
      for (let j = 0; j < Math.round(f[s.k] / 10); j++) { ctx.fillStyle = s.color; ctx.fillRect((n % COLS) * cell + 1, Math.floor(n / COLS) * cell + 1, cell - 2, cell - 2); n++; }
    }
  };
}
// a player: steps 0..last calling every view; autoplays once when `watch` comes into view
function player(views, button, watch, playLabel) {
  let i = D.last, timer = null;
  const show = j => { i = j; views.forEach(v => v(j)); };
  const stop = () => { clearInterval(timer); timer = null; button.dataset.state = 'stopped'; button.querySelector('.lbl').textContent = playLabel(i >= D.last); };
  const play = () => {
    if (timer) return stop();
    if (i >= D.last) show(0);
    button.dataset.state = 'playing'; button.querySelector('.lbl').textContent = 'Pause';
    timer = setInterval(() => { show(i + 1); if (i >= D.last) stop(); }, 85);
  };
  button.addEventListener('click', play);
  show(D.last); stop();
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still) { const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); show(0); play(); } }, {threshold: .3}); io.observe(watch); }
  return {show, get i() { return i; }};
}

const $ = id => document.getElementById('pn-' + id);
const P = player([makeStack($('stack'), 210, true), makeMonths($('months'), 84), makeWaffle($('waffle')),
  i => { $('date').textContent = label(i); $('pipe').textContent = FRAMES[i].pipe.toLocaleString(); $('recent').textContent = recentText(i); }],
  $('go'), $('stack'), end => end ? 'Replay: 2018 to today in 9 seconds' : 'Resume');
document.querySelector('#pipeline-anim details.pn-more').addEventListener('toggle', () => P.show(P.i));
$('note').textContent = `Every private housing project in the City's records since 2018. Each layer is homes at one stage that month; ` +
  `green on top is homes finished in the previous 12 months ("Entitled 3+ yrs, inactive": approved at least 36 months earlier, ` +
  `no building permit, and nothing recorded on the project's records in 36 months; "Permitted, not started": no inspection yet). ` +
  `The bars are homes finished each month. After the City's permit feed ends (${D.feed_end}), finishes come from the City's ` +
  `final inspections of the buildings in these records, through ${D.done_end}; a lighter bar is a month not yet covered. UC Berkeley's dormitories are counted in beds, not homes (${D.uc_beds.toLocaleString()} beds under construction ` +
  `or planned). Data: Pipeline Explorer, ${D.stamp}.`;
})();</script>
